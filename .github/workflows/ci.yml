# CI runs on a machine with no GPU, and that is the point.
#
# The parsers, the ring-theory arithmetic, the scaling maths and the P2P
# classifier are all pure functions over recorded evidence, so the whole
# interesting layer is testable on a free runner. What CI cannot check is the
# measurement layer -- that needs real cards and is verified by hand. See
# "What this run does NOT tell you" in any generated report for the same idea
# applied to results.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range. Anything that works
        # on both works on what is in between.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: lint
        run: ruff check .

      - name: test
        run: pytest -q

      # A syntax error in a module CI never imports is still a syntax error the
      # first user will hit. compileall touches every file, including the ones
      # that require torch or CUDA to actually run.
      - name: compile every module
        run: python -m compileall -q nodebench recipes examples tests

      # The README links this file on the first screen. If it stops generating,
      # the front door of the project is broken.
      - name: regenerate the example report
        run: |
          python examples/make_sample.py
          test -s examples/sample_report.html
